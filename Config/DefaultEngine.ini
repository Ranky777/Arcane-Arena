[ConsoleVariables]
; UE 5.8 的 UGameplayAbility 静态校验要求 CooldownGameplayEffectClass 在"资产"里授予 Tag，
; 否则能力编译失败（"grants no tags"）。本项目用共享冷却容器 GE_Cooldown，冷却 Tag 在运行时经
; DynamicGrantedTags 注入（UArcaneGameplayAbility 重写 GetCooldownTags/ApplyCooldown），
; 故该静态校验对本项目是误报。按引擎注释（GameplayAbility.cpp 中 CVarWarnCooldownEffectWithoutTags）
; 的建议关闭它，使所有使用该容器的能力能正常编译。
AbilitySystem.WarnCooldownEffectWithoutTags=0

